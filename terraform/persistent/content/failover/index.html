<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route 53 failover site</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #16191f; --sub: #545b64; --card: #f7f8fa; --line: #aab7b8;
      --accent: #007cbd; --mute: #7d8791; --off-fill: #eceef0;
      --purple: #8c4fff; --green: #4f7a0a; --red: #c8203a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419; --fg: #e8eaed; --sub: #a0a8b0; --card: #1a212a; --line: #3a4550;
        --accent: #4db3e6; --mute: #8a949e; --off-fill: #232a31;
        --purple: #a98bff; --green: #9bc53d; --red: #ff6b81;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5; }
    main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 48px; }
    .intro { max-width: 40rem; margin: 0 auto; padding: 24px 0 8px; text-align: center; }
    h1 { font-size: 3rem; line-height: 1.1; margin: 0 0 32px; }
    .intro section { margin: 0 0 40px; }
    .intro p { margin: 0 0 12px; }
    .key { font-size: 1.35rem; line-height: 1.4; }
    .note { color: var(--sub); text-wrap: balance; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    svg { display: block; width: 100%; min-width: 900px; height: auto; }

    /* SVG theme classes */
    .zone { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .sect { fill: none; stroke: var(--sub); stroke-width: 1.2; }
    .vpc { fill: none; stroke: var(--purple); stroke-width: 1.5; }
    .vpc-t { fill: var(--purple); font-size: 13px; font-weight: 700; }
    .grp-purple { fill: var(--purple); fill-opacity: .06; stroke: var(--purple); stroke-width: 1.5; }
    .grp-green  { fill: #5f8a0c; fill-opacity: .07; stroke: var(--green); stroke-width: 1.5; }
    .grp-red    { fill: var(--red); fill-opacity: .06; stroke: var(--red); stroke-width: 1.5; }
    .grp-off    { fill: var(--off-fill); stroke: var(--mute); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .card-on { fill: var(--card); stroke: var(--green); stroke-width: 2; }
    .card-off { fill: var(--off-fill); stroke: var(--mute); stroke-width: 1; stroke-dasharray: 4 3; }
    .az-off { fill: none; stroke: var(--mute); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .sn { fill: var(--mute); font-size: 11px; font-weight: 700; }
    .span-off { fill: var(--mute); fill-opacity: .14; stroke: var(--mute); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .card-ec2 { fill: var(--bg); stroke: var(--mute); stroke-width: 1; }
    .sub-off { fill: none; stroke: var(--mute); stroke-width: 1.2; }
    .hz { fill: none; stroke: var(--sub); stroke-width: 1.2; }
    .chip-purple { fill: var(--purple); } .chip-green { fill: #5f8a0c; } .chip-red { fill: var(--red); } .chip-off { fill: var(--mute); }
    .chip-t { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; }
    .gh { fill: var(--fg); font-size: 13px; font-weight: 700; }
    .gh-off { fill: var(--mute); font-size: 13px; font-weight: 700; }
    .gs { fill: var(--sub); font-size: 10px; }
    .gs-off { fill: var(--mute); font-size: 10px; }
    .ct { fill: var(--fg); font-size: 11.5px; font-weight: 700; }
    .ct-off { fill: var(--mute); font-size: 11.5px; font-weight: 700; }
    .cs { fill: var(--sub); font-size: 10.5px; }
    .cs-off { fill: var(--mute); font-size: 10.5px; }
    .st-on { fill: var(--green); font-size: 10px; font-weight: 700; text-anchor: end; }
    .st-off { fill: var(--mute); font-size: 10px; font-weight: 700; text-anchor: end; }
    .down-pill { fill: #c8203a; }
    .ok-pill { fill: #4f7a0a; }
    .pill-t { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; letter-spacing: .4px; }
    .down-t { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; letter-spacing: .5px; }
    .down-note { fill: var(--red); font-size: 11px; font-weight: 700; }
    .lbl { fill: var(--sub); font-size: 10px; text-anchor: middle; }
    .lbl-l { fill: var(--sub); font-size: 10px; }
    .lbl-off { fill: var(--mute); font-size: 10px; }
    .req  { stroke: var(--accent); stroke-width: 2; fill: none; }
    .resp { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .ref  { stroke: var(--mute); stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; }
    .ref-on { stroke: var(--green); stroke-width: 2; fill: none; stroke-dasharray: 3 4; }
    .m-acc { fill: var(--accent); } .m-mute { fill: var(--mute); } .m-on { fill: var(--green); }
    .badge { fill: var(--accent); }
    .badge-t { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>
</head>
<body>
<main>
  <div class="intro">
    <h1>Hi</h1>

    <section>
      <p class="key">Route 53 routed you to the failover page</p>
      <p class="note">The primary environment is shut down to save cost</p>
    </section>

    <section>
      <p class="key">You can deploy the primary environment yourself</p>
      <p class="note">Click to start Terraform job. It is destroyed automatically after 30 minutes</p>
      <p><button type="button" disabled>Deploy primary environment</button></p>
    </section>
  </div>

  <div class="scroll">
  <svg viewBox="0 0 1200 1310" role="img" aria-labelledby="dg-title dg-desc">
    <title id="dg-title">Request path from a user's device to the Route 53 failover site</title>
    <desc id="dg-desc">The device asks a DNS resolver, which queries Route 53. The primary record points to the Application Load Balancer in the VPC, which is currently down. Behind it, shown greyed out, the VPC spans three availability zones, each with a public subnet and a private subnet. The load balancer, with its listeners and target group and its HTTPS certificate from ACM, spans the public subnets and forwards to one EC2 instance per zone in an Auto Scaling group, which is defined by a launch template. The instances pull their container image from ECR through VPC endpoints. Because the primary is down, the secondary record to CloudFront is used. The device connects to CloudFront over HTTPS using an ACM certificate. CloudFront uses origin access control to fetch the website files from a private S3 bucket.</desc>
    <defs>
      <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-acc"/></marker>
      <marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-mute"/></marker>
      <marker id="a-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-on"/></marker>
    </defs>

    <!-- ===== Legend ===== -->
    <g transform="translate(-292 11)">
    <rect class="card" x="600" y="6" width="584" height="36" rx="8"/>
    <text class="gh" x="614" y="24" style="dominant-baseline:central">Legend</text>
    <path class="req" d="M684 24 H728" marker-end="url(#a-acc)"/>
    <text class="lbl-l" x="738" y="24" style="dominant-baseline:central">Request</text>
    <path class="resp" d="M810 24 H854" marker-end="url(#a-acc)"/>
    <text class="lbl-l" x="864" y="24" style="dominant-baseline:central">Response</text>
    <path class="ref" d="M944 24 H988" marker-end="url(#a-mute)"/>
    <text class="lbl-l" x="998" y="24" style="dominant-baseline:central">Association</text>
    <circle class="badge" cx="1094" cy="24" r="12"/>
    <text class="badge-t" x="1094" y="24" >n</text>
    <text class="lbl-l" x="1114" y="24" style="dominant-baseline:central">Step order</text>
    </g>

    <g transform="translate(0 20)">

    <!-- ===== Boundaries ===== -->
    <rect class="zone" x="16" y="50" width="200" height="290" rx="10"/>
    <text class="gh" x="30" y="72">Internet</text>
    <rect class="zone" x="240" y="50" width="944" height="1218" rx="10"/>
    <text class="gh" x="254" y="72">AWS Cloud</text>

    <!-- Managed services section -->
    <rect class="sect" x="256" y="134" width="912" height="466" rx="8"/>
    <text class="gh" x="270" y="156">Managed services</text>
    <text class="gs" x="270" y="171">Outside the VPC</text>

    <!-- VPC section -->
    <rect class="vpc" x="256" y="620" width="912" height="632" rx="8"/>
    <text class="vpc-t" x="270" y="642">VPC</text>
    <text class="gs" x="302" y="642">eu-north-1 · 10.0.0.0/16</text>

    <!-- ===== Internet ===== -->
    <rect class="card" x="32" y="95" width="168" height="60" rx="6"/>
    <text class="ct" x="44" y="117">User device</text>
    <text class="cs" x="44" y="137">Browser: aws1.dev.saruno.lt</text>

    <rect class="card" x="32" y="240" width="168" height="70" rx="6"/>
    <text class="ct" x="44" y="262">Recursive DNS resolver</text>
    <text class="cs" x="44" y="282">ISP or public DNS</text>

    <!-- ===== Route 53 ===== -->
    <rect class="grp-purple" x="270" y="184" width="260" height="260" rx="10"/>
    <rect class="chip-purple" x="282" y="194" width="26" height="26" rx="4"/>
    <text class="chip-t" x="295" y="211">R53</text>
    <text class="gh" x="314" y="212">Amazon Route 53</text>
    <text class="gs" x="314" y="227">DNS · global</text>

    <rect class="hz" x="284" y="244" width="232" height="196" rx="8"/>
    <text class="ct" x="296" y="263">Public hosted zone</text>
    <text class="cs" x="296" y="279">dev.saruno.lt</text>

    <rect class="card-off" x="296" y="288" width="208" height="66" rx="6"/>
    <text class="ct-off" x="308" y="308">Primary record</text>
    <rect class="down-pill" x="420" y="297" width="76" height="16" rx="8"/>
    <text class="pill-t" x="458" y="305.5">UNHEALTHY</text>
    <text class="cs-off" x="308" y="326">aws1.dev.saruno.lt</text>
    <text class="cs-off" x="308" y="340">Points to ALB (hostname alias)</text>

    <rect class="card-on" x="296" y="364" width="208" height="66" rx="6"/>
    <text class="ct" x="308" y="384">Secondary record</text>
    <rect class="ok-pill" x="438" y="373" width="58" height="16" rx="8"/>
    <text class="pill-t" x="467" y="381.5">HEALTHY</text>
    <text class="cs" x="308" y="402">aws1.dev.saruno.lt</text>
    <text class="cs" x="308" y="416">Points to CloudFront (hostname alias)</text>

    <!-- ===== CloudFront ===== -->
    <rect class="grp-purple" x="600" y="184" width="260" height="260" rx="10"/>
    <rect class="chip-purple" x="612" y="194" width="26" height="26" rx="4"/>
    <text class="chip-t" x="625" y="211">CF</text>
    <text class="gh" x="644" y="212">Amazon CloudFront</text>
    <text class="gs" x="644" y="227">CDN · global</text>

    <rect class="card" x="614" y="259" width="232" height="70" rx="6"/>
    <text class="ct" x="626" y="283">HTTPS endpoint</text>
    <text class="cs" x="626" y="303">TLS certificate from ACM</text>

    <rect class="card" x="614" y="349" width="232" height="70" rx="6"/>
    <text class="ct" x="626" y="373">Origin access control (OAC)</text>
    <text class="cs" x="626" y="393">Private access to the S3 bucket</text>

    <!-- ===== S3 ===== -->
    <rect class="grp-green" x="930" y="184" width="224" height="260" rx="10"/>
    <rect class="chip-green" x="942" y="194" width="26" height="26" rx="4"/>
    <text class="chip-t" x="955" y="211">S3</text>
    <text class="gh" x="974" y="212">Amazon S3</text>
    <text class="gs" x="974" y="227">Object storage · eu-north-1</text>

    <rect class="card" x="944" y="259" width="196" height="70" rx="6"/>
    <text class="ct" x="956" y="283">Private bucket</text>
    <text class="cs" x="956" y="303">Reachable only via CloudFront</text>

    <rect class="card" x="944" y="349" width="196" height="70" rx="6"/>
    <text class="ct" x="956" y="373">Website source files</text>
    <text class="cs" x="956" y="393">index.html</text>

    <!-- ===== ACM ===== -->
    <rect class="grp-red" x="600" y="484" width="260" height="96" rx="10"/>
    <rect class="chip-red" x="612" y="494" width="26" height="26" rx="4"/>
    <text class="chip-t" x="625" y="511">ACM</text>
    <text class="gh" x="644" y="512">AWS Certificate Manager</text>
    <text class="gs" x="644" y="527">HTTPS certificate · us-east-1</text>

    <!-- ===== Behind the ALB (in VPC): three AZs, greyed out, inactive ===== -->
    <rect class="az-off" x="500" y="660" width="212" height="576" rx="8"/>
    <text class="gh-off" x="512" y="680">eu-north-1a</text>
    <rect class="sub-off" x="510" y="688" width="192" height="272" rx="8"/>
    <text class="sn" x="522" y="706">Public subnet · 10.0.101.0/24</text>
    <rect class="sub-off" x="510" y="988" width="192" height="232" rx="8"/>
    <text class="sn" x="522" y="1006">Private subnet · 10.0.1.0/24</text>
    <rect class="az-off" x="720" y="660" width="212" height="576" rx="8"/>
    <text class="gh-off" x="732" y="680">eu-north-1b</text>
    <rect class="sub-off" x="730" y="688" width="192" height="272" rx="8"/>
    <text class="sn" x="742" y="706">Public subnet · 10.0.102.0/24</text>
    <rect class="sub-off" x="730" y="988" width="192" height="232" rx="8"/>
    <text class="sn" x="742" y="1006">Private subnet · 10.0.2.0/24</text>
    <rect class="az-off" x="940" y="660" width="212" height="576" rx="8"/>
    <text class="gh-off" x="952" y="680">eu-north-1c</text>
    <rect class="sub-off" x="950" y="688" width="192" height="272" rx="8"/>
    <text class="sn" x="962" y="706">Public subnet · 10.0.103.0/24</text>
    <rect class="sub-off" x="950" y="988" width="192" height="232" rx="8"/>
    <text class="sn" x="962" y="1006">Private subnet · 10.0.3.0/24</text>

    <!-- ALB: one bar across the public subnets, with its details inside -->
    <rect class="span-off" x="268" y="716" width="884" height="224" rx="10"/>
    <rect class="chip-off" x="278" y="726" width="26" height="26" rx="4"/>
    <text class="chip-t" x="291" y="743">ALB</text>
    <text class="gh-off" x="312" y="738">Application Load Balancer</text>
    <text class="gs-off" x="312" y="753">Primary site</text>
    <rect class="down-pill" x="278" y="762" width="96" height="22" rx="11"/>
    <text class="down-t" x="326" y="773">UNHEALTHY</text>
    <text class="down-note" x="278" y="802">Currently not serving traffic</text>

    <rect class="card-ec2" x="278" y="814" width="196" height="46" rx="6"/>
    <text class="ct-off" x="288" y="833">Listeners</text>
    <text class="cs-off" x="288" y="849">HTTPS uses an ACM certificate</text>

    <rect class="card-ec2" x="278" y="870" width="196" height="58" rx="6"/>
    <text class="ct-off" x="288" y="889">Target group</text>
    <text class="cs-off" x="288" y="905">Routes to Auto Scaling group</text>
    <text class="cs-off" x="288" y="921">instances on port 8080</text>

    <!-- ASG: one bar across the private subnets, with its details inside -->
    <rect class="span-off" x="268" y="1016" width="884" height="124" rx="10"/>
    <rect class="chip-off" x="278" y="1026" width="26" height="26" rx="4"/>
    <text class="chip-t" x="291" y="1043">ASG</text>
    <text class="gh-off" x="312" y="1038">Auto Scaling group</text>
    <text class="gs-off" x="312" y="1053">3 instances · t3.micro</text>

    <rect class="card-ec2" x="278" y="1070" width="196" height="58" rx="6"/>
    <text class="ct-off" x="288" y="1089">Launch template</text>
    <text class="cs-off" x="288" y="1105">Amazon Linux 2023 with Docker</text>
    <text class="cs-off" x="288" y="1121">Pulls the app image from ECR</text>

    <rect class="card-ec2" x="514" y="1030" width="184" height="52" rx="6"/>
    <rect class="chip-off" x="524" y="1043" width="26" height="26" rx="4"/>
    <text class="chip-t" x="537" y="1060">EC2</text>
    <text class="ct-off" x="558" y="1052">EC2 instance</text>
    <text class="cs-off" x="558" y="1068">Runs the app container</text>
    <rect class="card-ec2" x="734" y="1030" width="184" height="52" rx="6"/>
    <rect class="chip-off" x="744" y="1043" width="26" height="26" rx="4"/>
    <text class="chip-t" x="757" y="1060">EC2</text>
    <text class="ct-off" x="778" y="1052">EC2 instance</text>
    <text class="cs-off" x="778" y="1068">Runs the app container</text>
    <rect class="card-ec2" x="954" y="1030" width="184" height="52" rx="6"/>
    <rect class="chip-off" x="964" y="1043" width="26" height="26" rx="4"/>
    <text class="chip-t" x="977" y="1060">EC2</text>
    <text class="ct-off" x="998" y="1052">EC2 instance</text>
    <text class="cs-off" x="998" y="1068">Runs the app container</text>

    <!-- VPC endpoints (AZ a only) -->
    <rect class="card-ec2" x="520" y="1160" width="172" height="44" rx="6"/>
    <rect class="chip-off" x="530" y="1169" width="26" height="26" rx="4"/>
    <text class="chip-t" x="543" y="1186">EP</text>
    <text class="ct-off" x="564" y="1179">VPC endpoints</text>
    <text class="cs-off" x="564" y="1194">ECR and SSM access</text>

    <!-- ===== ECR (managed, greyed: only used by the primary site) ===== -->
    <rect class="grp-off" x="290" y="484" width="240" height="96" rx="10"/>
    <rect class="chip-off" x="302" y="494" width="26" height="26" rx="4"/>
    <text class="chip-t" x="315" y="511">ECR</text>
    <text class="gh-off" x="334" y="512">Amazon ECR</text>
    <text class="gs-off" x="334" y="527">Container images · eu-north-1</text>

    <!-- ===== Flow arrows ===== -->
    <!-- 1 device -> resolver -->
    <path class="req" d="M116 155 V238" marker-end="url(#a-acc)"/>
    <!-- 2 resolver -> hosted zone -->
    <path class="req" d="M200 262 H282" marker-end="url(#a-acc)"/>
    <!-- 3 DNS answer: from the secondary record -->
    <path class="resp" d="M296 397 H250 V292 H202" marker-end="url(#a-acc)"/>
    <!-- ACM attached -->
    <path class="ref" d="M730 482 V446" marker-end="url(#a-mute)"/>
    <text class="lbl-l" x="740" y="468">attached</text>
    <!-- inactive path: ALB -> instances (per AZ), endpoints -> ECR -->
    <path class="ref" d="M686 940 V1014" marker-end="url(#a-mute)"/>
    <path class="ref" d="M906 940 V1014" marker-end="url(#a-mute)"/>
    <path class="ref" d="M1126 940 V1014" marker-end="url(#a-mute)"/>
    <text class="lbl-off" x="858" y="979">forwards</text>
    <path class="ref" d="M606 1204 V1226 H262 V540 H288" marker-end="url(#a-mute)"/>
    <text class="lbl-off" x="270" y="612">pulls image</text>
    <!-- ACM -> ALB (HTTPS certificate) -->
    <path class="ref" d="M640 582 V640 H487 V714" marker-end="url(#a-mute)"/>
    <text class="lbl-off" x="540" y="634">attached</text>
    <!-- 4 device -> CloudFront -->
    <path class="req" d="M200 120 H810 V257" marker-end="url(#a-acc)"/>
    <text class="lbl-l" x="330" y="114">HTTPS request</text>
    <!-- 6 CloudFront -> device -->
    <path class="resp" d="M835 257 V100 H202" marker-end="url(#a-acc)"/>
    <text class="lbl-l" x="330" y="94">Response: this page</text>
    <!-- 5 CloudFront <-> S3 -->
    <path class="req" d="M846 366 H942" marker-end="url(#a-acc)"/>
    <path class="resp" d="M944 402 H848" marker-end="url(#a-acc)"/>
    <text class="lbl" x="895" y="391">files</text>

    <!-- ===== Step badges ===== -->
    <g>
      <circle class="badge" cx="116" cy="196" r="13"/><text class="badge-t" x="116" y="196">1</text>
      <circle class="badge" cx="240" cy="262" r="13"/><text class="badge-t" x="240" y="262">2</text>
      <circle class="badge" cx="250" cy="345" r="13"/><text class="badge-t" x="250" y="345">3</text>
      <circle class="badge" cx="590" cy="120" r="13"/><text class="badge-t" x="590" y="120">4</text>
      <circle class="badge" cx="895" cy="366" r="13"/><text class="badge-t" x="895" y="366">5</text>
      <circle class="badge" cx="530" cy="100" r="13"/><text class="badge-t" x="530" y="100">6</text>
    </g>
    </g>
  </svg>
  </div>
</main>
</body>
</html>
